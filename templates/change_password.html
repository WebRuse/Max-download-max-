{% extends "base.html" %}

{% block title %}WebRuse — Change Password{% endblock %}

{% block content %}

<section
    style="
        max-width: 520px;
        margin: 30px auto;
        background: #fff;
        border: 1px solid #c8c8c8;
        box-sizing: border-box;
    "
>

    <div
        style="
            padding: 12px 16px;
            background: #f1f1f1;
            border-bottom: 1px solid #c8c8c8;
            font-size: 18px;
            font-weight: bold;
        "
    >
        Change Password
    </div>

    <div style="padding: 22px;">

        <p
            style="
                margin-top: 0;
                color: #555;
                font-size: 14px;
            "
        >
            Change the password used to sign in to your WebRuse account.
        </p>

        <label
            for="currentPassword"
            style="
                display: block;
                margin-bottom: 6px;
                font-weight: bold;
                font-size: 13px;
            "
        >
            Current Password
        </label>

        <input
            id="currentPassword"
            type="password"
            autocomplete="current-password"
            style="
                width: 100%;
                box-sizing: border-box;
                padding: 9px;
                border: 1px solid #aaa;
                font-size: 14px;
                margin-bottom: 14px;
            "
        >

        <label
            for="newPassword"
            style="
                display: block;
                margin-bottom: 6px;
                font-weight: bold;
                font-size: 13px;
            "
        >
            New Password
        </label>

        <input
            id="newPassword"
            type="password"
            autocomplete="new-password"
            style="
                width: 100%;
                box-sizing: border-box;
                padding: 9px;
                border: 1px solid #aaa;
                font-size: 14px;
                margin-bottom: 14px;
            "
        >

        <label
            for="confirmPassword"
            style="
                display: block;
                margin-bottom: 6px;
                font-weight: bold;
                font-size: 13px;
            "
        >
            Confirm New Password
        </label>

        <input
            id="confirmPassword"
            type="password"
            autocomplete="new-password"
            style="
                width: 100%;
                box-sizing: border-box;
                padding: 9px;
                border: 1px solid #aaa;
                font-size: 14px;
            "
        >

        <div
            style="
                margin-top: 18px;
                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: 10px;
            "
        >

            <a
                href="/settings"
                style="
                    color: #1675d1;
                    font-size: 13px;
                "
            >
                Back to Settings
            </a>

            <button
                type="button"
                id="changePasswordButton"
                class="creator-create-button"
            >
                Change Password
            </button>

        </div>

        <div
            id="message"
            style="
                margin-top: 14px;
                font-size: 13px;
            "
        ></div>

    </div>

</section>

<script>

const button =
    document.getElementById(
        "changePasswordButton"
    );

const message =
    document.getElementById("message");


button.addEventListener(
    "click",
    async function () {

        const currentPassword =
            document.getElementById(
                "currentPassword"
            ).value;

        const newPassword =
            document.getElementById(
                "newPassword"
            ).value;

        const confirmPassword =
            document.getElementById(
                "confirmPassword"
            ).value;


        if (!currentPassword) {

            message.innerText =
                "Please enter your current password.";

            message.style.color =
                "#c62828";

            return;
        }


        if (newPassword.length < 6) {

            message.innerText =
                "New password must contain at least 6 characters.";

            message.style.color =
                "#c62828";

            return;
        }


        if (newPassword !== confirmPassword) {

            message.innerText =
                "New passwords do not match.";

            message.style.color =
                "#c62828";

            return;
        }


        button.disabled = true;
        button.innerText = "Changing...";

        message.innerText = "";


        try {

            const response =
                await fetch(
                    "/api/password",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({

                            current_password:
                                currentPassword,

                            new_password:
                                newPassword,

                            confirm_password:
                                confirmPassword

                        })
                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                message.innerText =
                    data.detail ||
                    "Failed to change password.";

                message.style.color =
                    "#c62828";

                return;
            }


            message.innerText =
                "Password changed successfully.";

            message.style.color =
                "#2e7d32";


            document.getElementById(
                "currentPassword"
            ).value = "";

            document.getElementById(
                "newPassword"
            ).value = "";

            document.getElementById(
                "confirmPassword"
            ).value = "";


        } catch (error) {

            message.innerText =
                "Something went wrong.";

            message.style.color =
                "#c62828";

        } finally {

            button.disabled = false;

            button.innerText =
                "Change Password";

        }

    }
);

</script>

{% endblock %}
